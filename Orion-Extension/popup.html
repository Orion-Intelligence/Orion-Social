<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orion Social Scraper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <img src="icons/icon-48.png" alt="" class="logo">
        <div>
          <h1>Orion Social Scraper</h1>
          <p id="statusLabel">Loading</p>
        </div>
      </header>

      <section id="loginPanel" class="panel">
        <form id="authForm" class="form">
          <label>
            <span>Orion username</span>
            <input id="loginUsername" name="loginUsername" type="text" autocomplete="username">
          </label>

          <label>
            <span>Orion password</span>
            <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password">
          </label>

          <div class="actions">
            <button id="loginButton" type="submit">Login</button>
          </div>
          <p id="loginError" class="error"></p>
        </form>
      </section>

      <section id="connectionPanel" class="panel status" hidden>
        <div class="status-row">
          <span>Connection</span>
          <strong id="connectionValue">unknown</strong>
        </div>
        <div class="status-row">
          <span>State</span>
          <strong id="stateValue">unknown</strong>
        </div>
        <div class="status-row">
          <span>Auth</span>
          <strong id="authValue">unknown</strong>
        </div>
        <div class="status-row">
          <span>Active job</span>
          <strong id="jobValue">none</strong>
        </div>
        <div class="status-row">
          <span>Last error</span>
          <strong id="errorValue">none</strong>
        </div>
        <div class="status-row">
          <span>Last result</span>
          <strong id="resultValue">none</strong>
        </div>
        <div class="actions">
          <button id="connectButton" type="button">Reconnect</button>
          <button id="clearAuthButton" type="button" class="secondary">Logout</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
